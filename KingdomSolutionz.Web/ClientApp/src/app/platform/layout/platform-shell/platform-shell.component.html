<div class="platform-shell" [class.platform-shell--sidebar-open]="
    sidebarOpen
  ">

  <aside class="platform-sidebar" id="platform-sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        K
      </div>

      <div class="brand-copy">
        <strong>KingdomOS</strong>
        <span>by KingdomSolutionz</span>
      </div>
    </div>

    <section class="workspace-section">
      <p class="sidebar-section-label">
        Ministry workspace
      </p>

      <app-workspace-switcher>
      </app-workspace-switcher>
    </section>

    <nav class="platform-navigation" aria-label="KingdomOS navigation" *ngIf="
        navigationSections$ | async
          as navigationSections
      ">

      <section class="navigation-section" *ngFor="
          let section of navigationSections
        ">

        <p class="navigation-section-label">
          {{ section.label }}
        </p>

        <div class="navigation-items">
          <a *ngFor="let item of section.items" class="navigation-link" [routerLink]="item.route"
            routerLinkActive="navigation-link--active" [routerLinkActiveOptions]="{
              exact: item.exact === true
            }" ariaCurrentWhenActive="page" (click)="closeSidebar()">

            <span class="navigation-icon" [ngSwitch]="item.icon">

              <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" aria-hidden="true">

                <rect x="3" y="3" width="7" height="7" rx="1.5">
                </rect>

                <rect x="14" y="3" width="7" height="7" rx="1.5">
                </rect>

                <rect x="3" y="14" width="7" height="7" rx="1.5">
                </rect>

                <rect x="14" y="14" width="7" height="7" rx="1.5">
                </rect>
              </svg>

              <svg *ngSwitchCase="'requests'" viewBox="0 0 24 24" aria-hidden="true">

                <path d="M7 3.75h10a2 2 0 0 1 2 2v14.5H5V5.75a2 2 0 0 1 2-2Z">
                </path>

                <path d="M8.5 8h7"></path>
                <path d="M8.5 12h7"></path>
                <path d="M8.5 16h4"></path>
              </svg>

              <svg *ngSwitchCase="'journeys'" viewBox="0 0 24 24" aria-hidden="true">

                <circle cx="5" cy="18" r="2"></circle>
                <circle cx="19" cy="6" r="2"></circle>

                <path d="M7 18h3.5a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h8">
                </path>
              </svg>

            </span>

            <span class="navigation-copy">
              <strong>
                {{ item.label }}
              </strong>

              <small *ngIf="item.description">
                {{ item.description }}
              </small>
            </span>

            <span class="navigation-arrow">
              ›
            </span>
          </a>
        </div>
      </section>
    </nav>

    <div class="sidebar-spacer"></div>

    <button type="button" class="support-card">

      <span class="support-icon">
        ?
      </span>

      <span class="support-copy">
        <strong>Need help?</strong>
        <small>KingdomSolutionz support</small>
      </span>
    </button>
  </aside>

  <button type="button" class="sidebar-overlay" aria-label="Close navigation" (click)="closeSidebar()"
    [attr.aria-expanded]="sidebarOpen" aria-controls="platform-sidebar">
  </button>

  <div class="platform-main">
    <header class="platform-header" *ngIf="
        selectedWorkspace$ | async
          as selectedWorkspace
      ">

      <div class="header-left">
        <button type="button" class="mobile-menu-button" aria-label="Open navigation" (click)="toggleSidebar()">

          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="current-workspace">
          {{ selectedWorkspace.name }}
        </div>
      </div>

      <div class="header-right">
        <button type="button" class="notification-button" aria-label="Notifications">

          <svg viewBox="0 0 24 24" aria-hidden="true">

            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9">
            </path>

            <path d="M10 21h4">
            </path>
          </svg>

          <span class="notification-dot"></span>
        </button>

        <div class="user-avatar">
          CT
        </div>

        <div class="user-copy">
          <strong>Apostle Cynthia</strong>
          <span>Network administrator</span>
        </div>
      </div>
    </header>

    <main class="platform-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
