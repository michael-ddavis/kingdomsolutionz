<div
  class="kos-drawer-layer"
  [class.kos-drawer-layer--open]="open"
  [attr.aria-hidden]="!open">

  <button
    type="button"
    class="kos-drawer-overlay"
    tabindex="-1"
    [disabled]="!open"
    aria-label="Close drawer"
    (click)="requestClose()">
  </button>

  <section
    #drawerPanel
    class="kos-drawer"
    [class.kos-drawer--sm]="width === 'sm'"
    [class.kos-drawer--md]="width === 'md'"
    [class.kos-drawer--lg]="width === 'lg'"
    [attr.inert]="open ? null : ''"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="titleId">

    <header class="kos-drawer-heading">
      <div>
        <p
          class="kos-drawer-eyebrow"
          *ngIf="eyebrow">

          {{ eyebrow }}
        </p>

        <h2 [id]="titleId">
          {{ title }}
        </h2>
      </div>

      <button
        #closeButton
        type="button"
        class="kos-drawer-close"
        aria-label="Close drawer"
        (click)="requestClose()">

        <span aria-hidden="true">×</span>
      </button>
    </header>

    <div class="kos-drawer-content">
      <ng-content></ng-content>
    </div>
  </section>
</div>
